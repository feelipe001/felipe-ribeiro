<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Felipe Ribeiro — Links</title>
  <meta name="theme-color" content="#170817" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background: #050505;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      overflow-x: hidden;
      color: #fff;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      background:
        linear-gradient(
          to bottom,
          rgba(0,0,0,0.02) 0%,
          rgba(0,0,0,0.04) 20%,
          rgba(0,0,0,0.38) 55%,
          rgba(0,0,0,0.95) 77%,
          #000 100%
        );
    }

    /* Foto principal */
    .hero {
      position: relative;
      width: 100%;
      height: min(760px, 79vh);
      min-height: 610px;
      overflow: hidden;
      background: #160611;
    }

    .hero-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
      transform: scale(1.01);
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to bottom, rgba(0,0,0,0.00) 40%, rgba(0,0,0,0.16) 60%, rgba(0,0,0,0.94) 91%, #000 100%);
      pointer-events: none;
    }

    /* Elemento discreto no topo, semelhante ao perfil da referência */
    .mini-profile {
      position: absolute;
      left: 24px;
      top: 43%;
      transform: none;
      z-index: 4;
      opacity: 0.52;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 5px 10px 5px 5px;
      border-radius: 999px;
      background: rgba(24, 24, 24, 0.72);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 8px 26px rgba(0,0,0,0.20);
    }

    .mini-avatar {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      overflow: hidden;
      background: linear-gradient(135deg, #ff2d9d, #6417ff);
      flex: 0 0 auto;
    }

    .mini-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    .mini-name {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1px;
      white-space: nowrap;
    }

    /* Identificação centralizada, abaixo das mãos */
    .identity {
      position: absolute;
      left: 50%;
      bottom: 105px;
      transform: translateX(-50%);
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      text-align: left;
      opacity: 0.94;
      width: max-content;
      max-width: 88%;
    }

    .identity-avatar {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      overflow: hidden;
      background: linear-gradient(135deg, #ff2d9d, #6417ff);
      border: 2px solid rgba(255, 40, 175, 0.92);
      box-shadow: 0 5px 18px rgba(0,0,0,0.28);
      flex: 0 0 auto;
    }

    .identity-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
    }

    .identity-text {
      line-height: 1.08;
      text-shadow: 0 2px 10px rgba(0,0,0,0.72);
    }

    .name {
      font-size: 19px;
      font-weight: 500;
      letter-spacing: -0.2px;
    }

    .handle {
      margin-top: 5px;
      font-size: 14px;
      color: rgba(255,255,255,0.88);
    }

    /* Conteúdo */
    .content {
      position: relative;
      z-index: 10;
      width: min(94%, 520px);
      margin: -34px auto 0;
      padding: 0 0 26px;
    }

    .card-link {
      display: block;
      width: 100%;
      aspect-ratio: 1000 / 235;
      border-radius: 11px;
      overflow: hidden;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 10px 28px rgba(0,0,0,0.30);
      transition: transform 0.16s ease, box-shadow 0.16s ease;
    }

    .card-link:active {
      transform: scale(0.985);
      box-shadow: 0 7px 18px rgba(0,0,0,0.34);
    }

    .card-image {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      object-fit: fill;
    }

    /* Área para adicionar outros cards depois */
    .card-link + .card-link {
      margin-top: 5px;
    }

    .footer {
      padding: 11px 0 28px;
      text-align: center;
      color: rgba(255,255,255,0.72);
      font-size: 12px;
      letter-spacing: 0.15px;
    }

    @media (min-width: 700px) {
      .page {
        max-width: 560px;
        margin: 0 auto;
        box-shadow: 0 0 50px rgba(0,0,0,0.35);
      }

      .hero {
        height: 760px;
      }

      .identity {
        left: 50%;
        bottom: 105px;
        transform: translateX(-50%);
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <section class="hero">
      <img
        class="hero-image"
        src="https://res.cloudinary.com/f5yuukov/image/upload/v1789666241/07ef0ae8-9022-43dd-9bd7-4b04e58820d7.png"
        alt="Felipe Ribeiro"
      />
    </div>

<div class="identity">
        <div class="identity-avatar">
          <img
            src="https://res.cloudinary.com/f5yuukov/image/upload/v1789665013/8939182b-1615-4e73-b1bb-e12d179fd651.png"
            alt="Felipe Ribeiro"
          />
        </div>

        <div class="identity-text">
          <div class="name">Felipe Ribeiro</div>
          <div class="handle">@afroworlld</div>
        </div>
      </div>
    </section>

    <section class="content">
      <!-- Card 1: Como chegar aos primeiros 10 mil seguidores -->
      <a
        class="card-link"
        href="#"
        aria-label="Como chegar aos seus primeiros 10 mil seguidores"
      >
        <img
          class="card-image"
          src="https://res.cloudinary.com/f5yuukov/image/upload/v1789830469/2.png"
          alt="Como chegar aos seus primeiros 10 mil seguidores"
        />
      </a>

      <!-- Card 2: Meu YouTube -->
      <a
        class="card-link"
        href="https://youtube.com/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Meu YouTube"
      >
        <img
          class="card-image"
          src="https://res.cloudinary.com/f5yuukov/image/upload/v1789830470/1.png"
          alt="Meu YouTube"
        />
      </a>

      <div class="footer">
        © Felipe Ribeiro
      </div>
    </section>

  </main>
</body>
</html>
